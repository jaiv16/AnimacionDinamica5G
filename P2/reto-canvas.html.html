<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pagina imagen animada</title>

    <style>
        body {
            text-align: center;
        }

        canvas {
            border: 5px solid #350e23;
            background-color: goldenrod;
        }

        button {
            background-color: coral;
            color: royalblue;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>

    <script>
        var x = Math.random() * 650;
        var y = Math.random() * 450;   

        var dx = Math.random() < 0.5 ? 2 : -2;
        var dy = Math.random() < 0.5 ? 2 : -2;

        var imagen = new Image();
        imagen.src = "minion.jpg"; 

        function animate() {    
            requestAnimationFrame(animate);

            var canvas = document.getElementById("micanvas");
            var context = canvas.getContext("2d");

            context.clearRect(0, 0, innerWidth, innerHeight);

            context.drawImage(imagen, x, y, 150, 150); 

            if (x + 150 > 800 || x < 0) {
                dx = -dx;
            }

            if (y + 150 > 600 || y < 0) {
                dy = -dy;
            }

            x += dx;
            y += dy;
        }

        animate();
    </script>
</head>

<body>

    <canvas id="micanvas" width="800" height="600"></canvas>

    <br>

    <a href="../index.html">
        <button>Regresar al menú</button>
    </a>

</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minion Pixel Art - Overol Corregido</title>
  <style>
      canvas {
          border: 3px solid royalblue;
          background-color: skyblue;
      }
      
      button {
        background-color: coral;
        color: royalblue;
        border: none;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 10px;
        cursor: pointer;
    }

    .regresar {
        margin-top: 20px;
    }
  </style>

<script>
    var contador = 0;
    var bloquesAmostrar = 0;

    function animate() {
        requestAnimationFrame(animate);
        var canvas = document.getElementById("micanvas");
        var context = canvas.getContext("2d");
        
        context.clearRect(0, 0, canvas.width, canvas.height);

        contador++;
        if (contador % 2 === 0) { 
            bloquesAmostrar++;
        }

        var b = 0;

        function d(color, x, y) {
            b++;
            if (b <= bloquesAmostrar) {
                context.fillStyle = color;
                context.fillRect(50 + x * 40, 90 + y * 40, 40, 40);
            }
        }

        // --- FILA 0: Parte superior ---
        d("gray", 2, 0); d("gray", 3, 0); d("yellow", 4, 0); d("yellow", 5, 0); d("yellow", 6, 0); d("gray", 7, 0); d("gray", 8, 0);

        // --- FILA 1: Marco de ojos superior ---
        d("gray", 1, 1); d("white", 2, 1); d("white", 3, 1); d("gray", 4, 1); d("yellow", 5, 1); d("gray", 6, 1); d("white", 7, 1); d("white", 8, 1); d("gray", 9, 1);

        // --- FILA 2: Lentes y pupila arriba ---
        d("gray", 0, 2); d("white", 1, 2); d("black", 2, 2); d("black", 3, 2); d("gray", 4, 2); d("gray", 5, 2); d("gray", 6, 2); d("black", 7, 2); d("black", 8, 2); d("white", 9, 2); d("gray", 10, 2);

        // --- FILA 3: Pupilas y brillo ---
        d("gray", 0, 3); d("white", 1, 3); d("black", 2, 3); d("white", 3, 3); d("gray", 4, 3); d("gray", 5, 3); d("gray", 6, 3); d("black", 7, 3); d("white", 8, 3); d("white", 9, 3); d("gray", 10, 3);

        // --- FILA 4: Pupila abajo ---
        d("gray", 0, 4); d("white", 1, 4); d("black", 2, 4); d("black", 3, 4); d("gray", 4, 4); d("gray", 5, 4); d("gray", 6, 4); d("black", 7, 4); d("black", 8, 4); d("white", 9, 4); d("gray", 10, 4);

        // --- FILA 5: Marco inferior ---
        d("gray", 0, 5); d("gray", 1, 5); d("gray", 2, 5); d("gray", 3, 5); d("gray", 4, 5); d("gray", 5, 5); d("gray", 6, 5); d("gray", 7, 5); d("gray", 8, 5); d("gray", 9, 5); d("gray", 10, 5);

        // --- FILA 6: Cara amarilla y boca ---
        d("orange", 0, 6); d("gray", 1, 6); d("gray", 2, 6); d("gray", 3, 6); d("yellow", 4, 6); d("yellow", 5, 6); d("yellow", 6, 6); d("gray", 7, 6); d("gray", 8, 6); d("gray", 9, 6); d("orange", 10, 6);

        // --- FILA 7: Inicio de Tirantes del Overol ---
        d("yellow", 0, 7); d("royalblue", 1, 7); d("yellow", 2, 7); d("yellow", 3, 7); d("yellow", 4, 7); d("yellow", 5, 7); d("yellow", 6, 7); d("yellow", 7, 7); d("yellow", 8, 7); d("royalblue", 9, 7); d("yellow", 10, 7);

        // --- FILA 8: Pechera del Overol y Boca ---
        d("yellow", 0, 8); d("yellow", 1, 8); d("royalblue", 2, 8); d("royalblue", 3, 8); d("royalblue", 4, 8); d("black", 5, 8); d("royalblue", 6, 8); d("royalblue", 7, 8); d("royalblue", 8, 8); d("yellow", 9, 8); d("yellow", 10, 8);

        // --- FILA 9: Cuerpo cubierto de azul ---
        d("yellow", 0, 9); d("royalblue", 1, 9); d("royalblue", 2, 9); d("royalblue", 3, 9); d("royalblue", 4, 9); d("royalblue", 5, 9); d("royalblue", 6, 9); d("royalblue", 7, 9); d("royalblue", 8, 9); d("royalblue", 9, 9); d("yellow", 10, 9);

        // --- FILA 10: Base del Overol ---
        d("orange", 0, 10); d("royalblue", 1, 10); d("royalblue", 2, 10); d("royalblue", 3, 10); d("royalblue", 4, 10); d("royalblue", 5, 10); d("royalblue", 6, 10); d("royalblue", 7, 10); d("royalblue", 8, 10); d("royalblue", 9, 10); d("orange", 10, 10);

        // --- FILA 11: Zapatos / Base ---
        d("SaddleBrown", 1, 11); d("SaddleBrown", 2, 11); d("SaddleBrown", 3, 11); d("SaddleBrown", 4, 11); d("SaddleBrown", 5, 11); d("SaddleBrown", 6, 11); d("SaddleBrown", 7, 11); d("SaddleBrown", 8, 11); d("SaddleBrown", 9, 11);
    }

    window.onload = function() {
        animate();
    };
</script>
</head>

<body>

   <canvas id="micanvas" width="700" height="700"></canvas>

   <br>

   <div class="regresar">
       <a href="../index.html">
           <button>Regresar al menú</button>
       </a>
   </div>

</body>
</html>

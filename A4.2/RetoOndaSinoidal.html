<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reto onda sinoidal</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #ffffff;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Cargar imágenes
  const bgImg = new Image();
  bgImg.src = 'Fondo.jpg';

  const pcmanImg = new Image();
  pcmanImg.src = 'pcman.png';

  // Configuración del personaje y la Onda Senoidal
  const pcman = {
    x: -70,           // Inicia fuera de la pantalla a la izquierda
    baseY: 225,       // Centro vertical del recorrido
    width: 70,
    height: 70,
    speedX: 2,        // Velocidad del avance horizontal
    amplitude: 40,    // Qué tanto sube y baja en Y
    frequency: 0.03   // Controla qué tan cerradas o abiertas son las curvas
  };

  let loadedImages = 0;

  function checkLoaded() {
    loadedImages++;
    if (loadedImages === 2) {
      animate();
    }
  }

  bgImg.onload = checkLoaded;
  pcmanImg.onload = checkLoaded;

  function animate() {
    // 1. Dibujar el fondo
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

    // 2. CÁLCULO DE LA ONDA SENOIDAL COMBINADO CON MOVIMIENTO HORIZONTAL
    // Se usa la posición X actual para calcular el ángulo del Seno
    const currentY = pcman.baseY + Math.sin(pcman.x * pcman.frequency) * pcman.amplitude;

    // 3. Dibujar a pcman en la nueva coordenada (X, Y)
    ctx.drawImage(pcmanImg, pcman.x, currentY, pcman.width, pcman.height);

    // 4. Avanzar horizontalmente hacia la derecha
    pcman.x += pcman.speedX;

    // 5. Reiniciar posición al salir de la pantalla por la derecha
    if (pcman.x > canvas.width) {
      pcman.x = -pcman.width;
    }

    // 6. Siguiente fotograma
    requestAnimationFrame(animate);
  }
</script>

</body>
</html>

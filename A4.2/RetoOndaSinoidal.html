<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reto onda sinoidal</title>
  <style>
    body {
      margin: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    canvas {
      border: 2px solid #ffffff;
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="450"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // 1. Cargar imágenes
  const bgImg = new Image();
  bgImg.src = 'Fondo.jpg';

  const pcmanImg = new Image();
  pcmanImg.src = 'pcman.png';

  const fantasmaImg = new Image();
  fantasmaImg.src = 'fantasma.png';

  let currentImg = pcmanImg;

  // Configuración del objeto
  const character = {
    x: 0,             // Inicia en el borde izquierdo
    baseY: 200,       // Centro vertical de la pantalla
    width: 70,
    height: 70,
    speedX: 3,        // Velocidad de movimiento horizontal
    amplitude: 40,    // Amplitud de la onda senoidal
    frequency: 0.03   // Frecuencia de la onda senoidal
  };

  let loadedImages = 0;

  function checkLoaded() {
    loadedImages++;
    if (loadedImages === 3) {
      animate();
    }
  }

  bgImg.onload = checkLoaded;
  pcmanImg.onload = checkLoaded;
  fantasmaImg.onload = checkLoaded;

  // Cambiar personaje al presionar la barra espaciadora
  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') {
      event.preventDefault(); // Evita el scroll de la ventana
      currentImg = (currentImg === pcmanImg) ? fantasmaImg : pcmanImg;
    }
  });

  function animate() {
    // 1. Dibujar imagen de fondo
    ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);

    // 2. Dibujar el texto centrado en la parte inferior (abajo)
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    
    // Sombra de fondo para destacar el texto sobre el fondo
    ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
    ctx.shadowBlur = 6;
    
    // canvas.height - 25 ubica el texto cerca del borde inferior
    ctx.fillText('Aplastá tu barra espaciadora', canvas.width / 2, canvas.height - 25);
    ctx.shadowBlur = 0; // Resetear sombra para que no afecte a las imágenes

    // 3. Cálculo de la Onda Senoidal
    const currentY = character.baseY + Math.sin(character.x * character.frequency) * character.amplitude;

    // 4. Dibujar al personaje activo
    ctx.drawImage(currentImg, character.x, currentY, character.width, character.height);

    // 5. Mover horizontalmente
    character.x += character.speedX;

    // 6. CONTROL DE REBOTE EN BORDES
    if (character.x + character.width >= canvas.width) {
      character.x = canvas.width - character.width;
      character.speedX *= -1; // Invierte dirección
    } else if (character.x <= 0) {
      character.x = 0;
      character.speedX *= -1; // Invierte dirección
    }

    // 7. Próximo fotograma
    requestAnimationFrame(animate);
  }
</script>

</body>
</html>

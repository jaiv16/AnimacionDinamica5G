<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dibujos con Canvas 2D API</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 25px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      justify-content: center;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .card h2 {
      font-size: 1.2rem;
      color: #34495e;
      margin-top: 0;
      margin-bottom: 12px;
    }

    canvas {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Dibujos con Canvas 2D API</h1>

  <div class="container">
    <!-- 1. Casita -->
    <div class="card">
      <h2>1. Casita</h2>
      <canvas id="canvasCasita" width="300" height="300"></canvas>
    </div>

    <!-- 2. Honguito -->
    <div class="card">
      <h2>2. Honguito</h2>
      <canvas id="canvasHonguito" width="300" height="300"></canvas>
    </div>

    <!-- 3. Estrella -->
    <div class="card">
      <h2>3. Estrella</h2>
      <canvas id="canvasEstrella" width="300" height="300"></canvas>
    </div>

    <!-- 4. Luna -->
    <div class="card">
      <h2>4. Luna (Kawaii)</h2>
      <canvas id="canvasLuna" width="300" height="300"></canvas>
    </div>

    <!-- 5. Libre / Limón -->
    <div class="card">
      <h2>5. Libre (Limón)</h2>
      <canvas id="canvasLimon" width="300" height="300"></canvas>
    </div>

    <!-- 6. Zorro Geométrico -->
    <div class="card">
      <h2>6. Zorro (Geométrico)</h2>
      <canvas id="canvasZorro" width="300" height="300"></canvas>
    </div>
  </div>

  <script>
    window.onload = function () {

      // ==========================================
      // 1. DIBUJO DE LA CASITA (Inspirado en la nueva imagen)[cite: 12]
      // ==========================================
      (function drawCasita() {
        const canvas = document.getElementById('canvasCasita');
        const ctx = canvas.getContext('2d');

        // Color de fondo suave rosado
        ctx.fillStyle = '#fceee9';
        ctx.fillRect(0, 0, 300, 300);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // --- 1. ÁRBOL (detrás de la casa) ---
        // Copa del árbol (verde)
        ctx.fillStyle = '#a8d5ad';
        ctx.beginPath();
        ctx.moveTo(112, 125);
        ctx.bezierCurveTo(70, 110, 52, 170, 68, 205);
        ctx.bezierCurveTo(80, 230, 120, 220, 115, 200);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Tronco del árbol
        ctx.fillStyle = '#a37153';
        ctx.beginPath();
        ctx.moveTo(88, 165);
        ctx.lineTo(84, 235);
        ctx.lineTo(95, 235);
        ctx.lineTo(95, 172);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Ramas y hojas (detalles del árbol)
        ctx.beginPath();
        ctx.moveTo(89, 175); ctx.lineTo(80, 185);
        ctx.moveTo(92, 192); ctx.lineTo(100, 185);
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(80, 150, 2, 0, Math.PI * 2);
        ctx.arc(102, 168, 2.5, 0, Math.PI * 2);
        ctx.arc(73, 188, 2, 0, Math.PI * 2);
        ctx.arc(102, 185, 2, 0, Math.PI * 2);
        ctx.fill();

        // --- 2. CHIMENEA ---
        ctx.fillStyle = '#f8a5a5';
        ctx.beginPath();
        ctx.rect(203, 83, 18, 32);
        ctx.fill();
        ctx.stroke();

        // --- 3. PAREDES DE LA CASA (Azul pastel) ---
        ctx.fillStyle = '#cbe3f7';
        ctx.beginPath();
        ctx.moveTo(112, 142);
        ctx.lineTo(168, 88);
        ctx.lineTo(225, 142);
        ctx.lineTo(225, 235);
        ctx.lineTo(112, 235);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // --- 4. TECHO (Rosa pastel) ---
        ctx.fillStyle = '#f8a5a5';
        ctx.beginPath();
        ctx.moveTo(168, 65);
        ctx.lineTo(245, 145);
        ctx.lineTo(235, 155);
        ctx.lineTo(168, 88);
        ctx.lineTo(101, 155);
        ctx.lineTo(91, 145);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // --- 5. PUERTA (Amarillo pastel) ---
        ctx.fillStyle = '#fbe38a';
        ctx.beginPath();
        ctx.rect(152, 178, 36, 57);
        ctx.fill();
        ctx.stroke();

        // Pomo de la puerta
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(180, 210, 2, 0, Math.PI * 2);
        ctx.fill();

        // --- 6. VENTANA CIRCULAR ---
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(170, 138, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Cruz de la ventana
        ctx.beginPath();
        ctx.moveTo(170, 124); ctx.lineTo(170, 152);
        ctx.moveTo(156, 138); ctx.lineTo(184, 138);
        ctx.stroke();

        // --- 7. LÍNEA DEL SUELO ---
        ctx.beginPath();
        ctx.moveTo(73, 235);
        ctx.lineTo(240, 235);
        ctx.stroke();
      })();


      // ==========================================
      // 2. DIBUJO DEL HONGUITO (Inspirado en la imagen 2)[cite: 2]
      // ==========================================
      (function drawHonguito() {
        const canvas = document.getElementById('canvasHonguito');
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#e52521';
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 5;
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(70, 150);
        ctx.bezierCurveTo(70, 80, 230, 80, 230, 150);
        ctx.quadraticCurveTo(150, 180, 70, 150);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.clip();
        ctx.fillStyle = '#ffffff';

        ctx.beginPath(); ctx.arc(150, 125, 28, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(80, 125, 22, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(220, 125, 22, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#f5e8d0';
        ctx.beginPath();
        ctx.moveTo(110, 155);
        ctx.bezierCurveTo(105, 210, 195, 210, 190, 155);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      })();


      // ==========================================
      // 3. DIBUJO DE LA ESTRELLA (Inspirado en la imagen 3)[cite: 3]
      // ==========================================
      (function drawEstrella() {
        const canvas = document.getElementById('canvasEstrella');
        const ctx = canvas.getContext('2d');

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 6;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        function drawStarPath(cx, cy, spikes, outerRadius, innerRadius) {
          let rot = Math.PI / 2 * 3;
          let step = Math.PI / spikes;

          ctx.beginPath();
          ctx.moveTo(cx, cy - outerRadius);
          for (let i = 0; i < spikes; i++) {
            let x = cx + Math.cos(rot) * outerRadius;
            let y = cy + Math.sin(rot) * outerRadius;
            ctx.lineTo(x, y);
            rot += step;

            x = cx + Math.cos(rot) * innerRadius;
            y = cy + Math.sin(rot) * innerRadius;
            ctx.lineTo(x, y);
            rot += step;
          }
          ctx.lineTo(cx, cy - outerRadius);
          ctx.closePath();
        }

        ctx.fillStyle = '#ffcc00';
        drawStarPath(150, 130, 5, 75, 40);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(135, 185); ctx.lineTo(135, 230); ctx.lineTo(110, 235);
        ctx.moveTo(165, 185); ctx.lineTo(165, 230); ctx.lineTo(190, 233);
        ctx.stroke();

        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.ellipse(125, 125, 20, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(175, 125, 20, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(125, 118, 12, 16, 0, 0, Math.PI * 2);
        ctx.ellipse(175, 118, 12, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffcc00';
        ctx.lineWidth = 4;
        drawStarPath(230, 160, 5, 20, 10);
        ctx.fill();
        ctx.stroke();
      })();


      // ==========================================
      // 4. DIBUJO DE LA LUNA KAWAII (Inspirado fielmente en la imagen 11)[cite: 11]
      // ==========================================
      (function drawLuna() {
        const canvas = document.getElementById('canvasLuna');
        const ctx = canvas.getContext('2d');

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#000000';
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 1. Silueta Creciente de la Luna
        ctx.beginPath();
        ctx.moveTo(172, 95);
        ctx.bezierCurveTo(90, 110, 95, 215, 212, 160);
        ctx.bezierCurveTo(145, 182, 138, 125, 172, 95);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 2. Brazo Izquierdo Extendido
        ctx.beginPath();
        ctx.moveTo(117, 148);
        ctx.quadraticCurveTo(88, 142, 75, 135);
        ctx.stroke();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.arc(75, 135, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // 3. Brazo Derecho Saliente
        ctx.beginPath();
        ctx.moveTo(150, 144);
        ctx.quadraticCurveTo(168, 143, 170, 150);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(170, 150, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // 4. Ojos (Dos puntitos)
        ctx.beginPath();
        ctx.arc(122, 140, 2.5, 0, Math.PI * 2);
        ctx.arc(139, 139, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // 5. Boca (Sonrisita pequeña en curva 'u')
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(131, 143, 3.5, 0.1 * Math.PI, 0.9 * Math.PI, false);
        ctx.stroke();
      })();


      // ==========================================
      // 5. DIBUJO LIBRE: LIMÓN CON HOJA (Inspirado en la imagen 5)[cite: 5]
      // ==========================================
      (function drawLimon() {
        const canvas = document.getElementById('canvasLimon');
        const ctx = canvas.getContext('2d');

        // Tallo
        ctx.fillStyle = '#5a3d28';
        ctx.beginPath();
        ctx.moveTo(105, 85); ctx.lineTo(120, 105); ctx.lineTo(110, 112); ctx.lineTo(95, 92);
        ctx.closePath();
        ctx.fill();

        // Hoja verde
        ctx.fillStyle = '#006428';
        ctx.beginPath();
        ctx.moveTo(112, 98);
        ctx.bezierCurveTo(120, 50, 190, 50, 205, 75);
        ctx.bezierCurveTo(170, 115, 120, 110, 112, 98);
        ctx.closePath();
        ctx.fill();

        // Limón
        ctx.fillStyle = '#ffe100';
        ctx.beginPath();
        ctx.moveTo(110, 115);
        ctx.bezierCurveTo(70, 160, 90, 230, 150, 250);
        ctx.bezierCurveTo(220, 270, 250, 200, 235, 150);
        ctx.bezierCurveTo(220, 100, 140, 90, 110, 115);
        ctx.closePath();
        ctx.fill();
      })();


      // ==========================================
      // 6. DIBUJO DEL ZORRO GEOMÉTRICO (Inspirado en la imagen 7)[cite: 7]
      // ==========================================
      (function drawZorro() {
        const canvas = document.getElementById('canvasZorro');
        const ctx = canvas.getContext('2d');

        ctx.lineJoin = 'miter';
        ctx.miterLimit = 3;
        ctx.lineCap = 'square';

        // 1. Fondo Amarillo - Cuerpo Principal de la Cabeza
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.moveTo(150, 255);
        ctx.lineTo(60, 165);
        ctx.lineTo(70, 60);
        ctx.lineTo(102, 75);
        ctx.lineTo(125, 115);
        ctx.lineTo(175, 115);
        ctx.lineTo(198, 75);
        ctx.lineTo(230, 60);
        ctx.lineTo(240, 165);
        ctx.closePath();
        ctx.fill();

        // 2. Trazo Negro Grueso Exterior del Marco
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 10;

        ctx.beginPath();
        ctx.moveTo(150, 260);
        ctx.lineTo(55, 165);
        ctx.lineTo(68, 50);
        ctx.lineTo(105, 68);
        ctx.lineTo(125, 110);
        ctx.lineTo(175, 110);
        ctx.lineTo(195, 68);
        ctx.lineTo(232, 50);
        ctx.lineTo(245, 165);
        ctx.closePath();
        ctx.stroke();

        // 3. Detalles Negros Interiores
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.moveTo(85, 75);
        ctx.lineTo(95, 130);
        ctx.lineTo(112, 110);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(215, 75);
        ctx.lineTo(205, 130);
        ctx.lineTo(188, 110);
        ctx.closePath();
        ctx.fill();

        // Ojos
        ctx.beginPath();
        ctx.moveTo(100, 150);
        ctx.lineTo(135, 170);
        ctx.lineTo(138, 195);
        ctx.lineTo(132, 180);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(200, 150);
        ctx.lineTo(165, 170);
        ctx.lineTo(162, 195);
        ctx.lineTo(168, 180);
        ctx.closePath();
        ctx.fill();

        // Franjas geométricas inferiores
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(78, 185);
        ctx.lineTo(130, 235);
        ctx.moveTo(222, 185);
        ctx.lineTo(170, 235);
        ctx.stroke();

        // Hocico
        ctx.beginPath();
        ctx.moveTo(138, 240);
        ctx.lineTo(162, 240);
        ctx.lineTo(150, 258);
        ctx.closePath();
        ctx.fill();
      })();

    };
  </script>
</body>
</html>

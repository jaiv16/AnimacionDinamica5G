<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Interactiva</title>

  <style>
    body { 
      text-align: center;
      background-color: goldenrod;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
    }

    canvas {
      background-color: white;
      border: 2px solid royalblue;
      margin-top: 20px;
    }

    aside {
      margin-top: 10px;
      font-weight: bold;
    }

    /* Botón para regresar al menú */
    button {
      background-color:  coral;
      color: royalblue;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: maroon;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <canvas id="canvas" width="1000" height="800"></canvas>

  <aside>
    Presiona Q, W, E, R o T para cambiar la fotografía.
  </aside>

  <!-- Botón para regresar al menú -->
  <a href="../index.html">
    <button>Regresar al menú</button>
  </a>

  <script>
    window.onload = function () {

      var canvas = document.getElementById("canvas");
      var context = canvas.getContext("2d");

      // Dimensiones para centrar el marco de la foto
      var fotoX = 200;
      var fotoY = 200;
      var fotoAncho = 600;
      var fotoAlto = 400;

      // Objeto principal de imagen
      var imagen = new Image();

      // Rutas de las imágenes asignadas a cada tecla
      var imagenes = {
        'q': 'Limon1.png',
        'w': 'Limon2.png',
        'e': 'Limon3.png',
        'r': 'Limon4.png',
        't': 'Limon5.png'
      };

      // Cargar la primera imagen por defecto
      imagen.src = imagenes['q'];

      // Dibujar cuando la imagen termine de cargar
      imagen.onload = function() {
        draw();
      };

      function draw() {

        // Limpiar el canvas
        context.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar la imagen
        if (imagen.complete && imagen.naturalWidth !== 0) {
          context.drawImage(
            imagen,
            fotoX,
            fotoY,
            fotoAncho,
            fotoAlto
          );
        }

        // Borde alrededor de la fotografía
        context.strokeStyle = '#333';
        context.lineWidth = 4;
        context.strokeRect(
          fotoX,
          fotoY,
          fotoAncho,
          fotoAlto
        );
      }

      // Detectar las teclas presionadas
      function onKeyboardEvent(event) {

        var key = event.key.toLowerCase();

        // Cambiar fotografía con Q, W, E, R o T
        if (imagenes[key]) {
          imagen.src = imagenes[key];
        }
      }

      // Activar el teclado
      window.addEventListener(
        'keydown',
        onKeyboardEvent,
        false
      );

      // Render inicial
      draw();
    };
  </script>

</body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Pulse Imagen - Arco</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: sans-serif;
      }

      canvas {
        background-color: #2b2b2b;
        border: 2px solid #555;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      }
    </style>
  </head>
  <body>

    <canvas id="canvas" width="1000" height="900"></canvas>

    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          angle = 0,
          centerScale = 1,
          range = 0.5,
          speed = 0.05;

      // Cargar la imagen del arco
      var bowImage = new Image();
      bowImage.src = 'corazon.png';

      // Posición de la imagen (Centro del canvas)
      var posX = canvas.width / 2;
      var posY = canvas.height / 2;

      // Tamaño base original de la imagen en px
      var baseWidth = 200;
      var baseHeight = 200;

      function drawFrame () {
        window.requestAnimationFrame(drawFrame, canvas);
        context.clearRect(0, 0, canvas.width, canvas.height);

        // Lógica idéntica a tu ejemplo con Math.sin()
        var scale = centerScale + Math.sin(angle) * range;
        angle += speed;

        // Renderizado de la imagen con la escala aplicada
        context.save();
        context.translate(posX, posY);

        // Calcular ancho y alto según la escala del pulso
        var currentWidth = baseWidth * scale;
        var currentHeight = baseHeight * scale;

        // Dibujar la imagen centrada
        context.drawImage(
          bowImage, 
          -currentWidth / 2, 
          -currentHeight / 2, 
          currentWidth, 
          currentHeight
        );

        context.restore();
      }

      // Iniciar animación cuando cargue la imagen
      bowImage.onload = function() {
        drawFrame();
      };
    };
    </script>
  </body>
</html>

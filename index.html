<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú de Actividades</title>

    <style>
        body {
            /* Fondo azul muy claro que armoniza con el azul pastel del logo */
            background-color: #f0f6fc;
            text-align: center;
            font-family: Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            color: #2c4c6e;
        }

        /* Estilo para integrar el logo */
        .logo-container {
            margin-bottom: 15px;
        }

        .logo-container img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%; /* Forma circular elegante */
            border: 4px solid #ffffff;
            box-shadow: 0 4px 12px rgba(182, 211, 242, 0.7);
        }

        h1 {
            /* Azul marino suave para un contraste limpio y elegante */
            color: #2c527a;
            margin: 10px 0 5px 0;
            font-size: 28px;
        }

        h2 {
            /* Azul medio a juego con el tono del logo */
            color: #5b8ec4;
            margin: 0 0 25px 0;
            font-size: 18px;
            font-weight: normal;
        }

        /* Contenedor en cuadrícula de 2 columnas */
        .menu {
            margin: 20px auto;
            width: 85%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .actividad {
            background-color: #ffffff;
            /* Borde con el color exacto del fondo de tu logo (#b6d3f2) */
            border: 2px solid #b6d3f2;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            box-shadow: 0 2px 6px rgba(44, 82, 122, 0.06);
        }

        /* Efecto al pasar el mouse por encima de la tarjeta */
        .actividad:hover {
            background-color: #b6d3f2;
            border-color: #8bb8e8;
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(44, 82, 122, 0.12);
        }

        .actividad a {
            color: #2c527a;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            width: 100%;
            padding: 16px;
            transition: color 0.25s ease;
        }

        .actividad:hover a {
            color: #ffffff;
        }

        /* Diseño responsivo para pantallas pequeñas / móviles */
        @media (max-width: 600px) {
            .menu {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulación de Nave - Límites y Fricción</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0d17;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      color: #fff;
      font-family: sans-serif;
    }
    canvas {
      border: 2px solid #334155;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
    }
  </style>
</head>
<body>

  <canvas id="canvas" width="800" height="600"></canvas>

  <script src="Navecita.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');

    // Cargar la imagen de fondo personalizada
    const fondo = new Image();
    fondo.src = "Cielo.jpg";

    const nave = new Navecita();
    nave.x = canvas.width / 2;
    nave.y = canvas.height / 2;

    // Parámetros de física
    const friction = 0.97;  // Aplicar fricción (reduce velocidad por frame)
    const vr = 0.08;        // Velocidad de rotación
    const thrust = 0.25;    // Aceleración

    // Control de teclas
    const keys = {
      ArrowLeft: false,
      ArrowRight: false,
      ArrowUp: false
    };

    window.addEventListener('keydown', (e) => {
      if (e.key in keys) keys[e.key] = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key in keys) keys[e.key] = false;
    });

    // Bucle principal de animación
    (function drawFrame() {
      window.requestAnimationFrame(drawFrame, canvas);
      context.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Dibujar el fondo "Cielo.jpg"
      if (fondo.complete && fondo.width > 0) {
        context.drawImage(fondo, 0, 0, canvas.width, canvas.height);
      } else {
        context.fillStyle = "#000";
        context.fillRect(0, 0, canvas.width, canvas.height);
      }

      // 2. Rotación y Aceleración
      if (keys.ArrowLeft) {
        nave.rotation -= vr;
      }
      if (keys.ArrowRight) {
        nave.rotation += vr;
      }
      if (keys.ArrowUp) {
        let ax = Math.cos(nave.rotation) * thrust;
        let ay = Math.sin(nave.rotation) * thrust;
        nave.vx += ax;
        nave.vy += ay;
        nave.showFlame = true;
      } else {
        nave.showFlame = false;
      }

      // 3. Aplicar Fricción
      nave.vx *= friction;
      nave.vy *= friction;

      // 4. Actualizar posición
      nave.x += nave.vx;
      nave.y += nave.vy;

      // 5. Aplicar Límites (Screen Wrap - reaparecer por el lado contrario)
      if (nave.x > canvas.width) {
        nave.x = 0;
      } else if (nave.x < 0) {
        nave.x = canvas.width;
      }

      if (nave.y > canvas.height) {
        nave.y = 0;
      } else if (nave.y < 0) {
        nave.y = canvas.height;
      }

      // 6. Dibuja el cohete
      nave.draw(context);
    })();
  </script>
</body>
</html>
